name: momo-youtube-check
run-name: momo-youtube-check (${{ inputs.langs }})

# YouTube 연결 점검 (1분): Secrets 의 client + refresh token 으로 토큰을 받고 어느 채널에 연결되는지만 확인.
# 빌드·업로드 없음. 값은 출력하지 않는다 (채널 이름·id 만). 설정: momo/docs/YOUTUBE_SETUP.md
on:
  workflow_dispatch:
    inputs:
      langs:
        description: '언어 (all / en / ko)'
        required: true
        default: 'all'
        type: choice
        options: [all, en, ko]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: momo/requirements.txt

      - name: Python 패키지
        run: python -m pip install -q -r momo/requirements.txt

      - name: 연결 점검
        env:
          LANGS: ${{ inputs.langs }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
          YOUTUBE_REFRESH_TOKEN_KO: ${{ secrets.YOUTUBE_REFRESH_TOKEN_KO }}
        run: python momo/youtube_check.py --lang "$LANGS" | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
