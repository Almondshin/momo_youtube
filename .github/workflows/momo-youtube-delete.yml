name: momo-youtube-delete
run-name: momo-youtube-delete ${{ inputs.ep }} ${{ inputs.lang }} ${{ inputs.video_id }}

# Deletes a video this pipeline uploaded (momo/youtube_delete.py: only ids recorded in youtube.json) — run it only when the
# user asked for that video to be removed. Records the deletion in youtube.json and commits it.
on:
  workflow_dispatch:
    inputs:
      ep:
        description: '에피소드 (예: ep11)'
        required: true
        type: string
      lang:
        description: '언어 (en / ko)'
        required: true
        type: string
      video_id:
        description: '지울 영상 id (youtube.json 의 previous_video_ids 에 있어야 함)'
        required: true
        type: string
      current:
        description: '지금 기록된 video_id 를 지움'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: momo-publish-${{ inputs.ep }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EP: ${{ inputs.ep }}
      LANG_IN: ${{ inputs.lang }}
      VIDEO_ID: ${{ inputs.video_id }}
      CURRENT: ${{ inputs.current }}
      BRANCH: ${{ github.ref_name }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 입력 검증
        run: |
          bad() { echo "::error::$1"; exit 1; }
          [[ "$EP" =~ ^ep[0-9]{2,3}$ ]] || bad "ep 형식 오류"
          [[ "$LANG_IN" =~ ^(en|ko)$ ]] || bad "lang 은 en / ko"
          [[ "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]] || bad "video_id 형식 오류"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: momo/requirements.txt

      - name: Python 패키지
        run: python -m pip install -q -r momo/requirements.txt

      - name: 영상 삭제
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
          YOUTUBE_REFRESH_TOKEN_KO: ${{ secrets.YOUTUBE_REFRESH_TOKEN_KO }}
        run: |
          args=(--ep "$EP" --lang "$LANG_IN" --video-id "$VIDEO_ID")
          if [ "$CURRENT" = "true" ]; then args+=(--current); fi
          python momo/youtube_delete.py "${args[@]}"

      - name: 기록 커밋 (youtube.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -- "momo/episodes/$EP/youtube.json"
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "momo: $EP 영상 삭제 기록 ($VIDEO_ID)"
          for i in 1 2 3 4 5; do
            if git push -q origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((i * 5))
            git pull -q --rebase --autostash origin "$BRANCH" || { git rebase --abort || true; echo "::error::rebase 충돌"; exit 1; }
          done
          echo "::error::push 실패"
          exit 1
