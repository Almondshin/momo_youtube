name: momo-ci

# momo 파이프라인 전체 테스트: 합성 픽스처로 validate → build en/ko → compile → upload --dry-run + 출력 규격 검증.
on:
  push:
    paths:
      - 'momo/**'
      - '.github/workflows/momo-*.yml'
  pull_request:
    paths:
      - 'momo/**'
      - '.github/workflows/momo-*.yml'

permissions:
  contents: read

concurrency:
  group: momo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: momo/requirements.txt

      - name: 도구 설치 (ffmpeg, 한글 폰트)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-nanum

      - name: Python 패키지
        run: python -m pip install -q -r momo/requirements.txt

      - name: 전체 테스트 (tests/run_all.sh)
        env:
          MOMO_TEST_DIR: ${{ runner.temp }}/momo-test
        run: bash momo/tests/run_all.sh

      - name: 로그·확인 시트 보관 (한글 렌더링 눈으로 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momo-ci-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/momo-test/logs/
            ${{ runner.temp }}/momo-test/root/episodes/*/out/*.jpg
            ${{ runner.temp }}/momo-test/root/episodes/*/out/**/check_*.jpg
            ${{ runner.temp }}/momo-test/root/episodes/*/out/*_timeline.json
            ${{ runner.temp }}/momo-test/root/episodes/*/plan.md
          retention-days: 7
          if-no-files-found: ignore
