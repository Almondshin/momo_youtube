name: momo-preview

# 생성 결과 미리보기. 세션 네트워크가 Higgsfield CDN 을 막을 때 러너가 받아서
# 작은 JPEG 미리보기를 momo-previews 브랜치(강제 푸시, 이력 없음)에 올린다.
on:
  push:
    paths:
      - 'momo/library/library.json'
      - 'momo/episodes/*/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momo-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 도구 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          python -m pip install -q Pillow numpy

      - name: 미리보기 생성
        run: python momo/preview_assets.py --out "$RUNNER_TEMP/previews"

      - name: momo-previews 브랜치로 푸시
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd "$RUNNER_TEMP/previews"
          git init -q -b momo-previews
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "previews for ${SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" momo-previews
